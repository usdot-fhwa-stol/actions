name: C++ Sonar Scanner workflow

on:
  workflow_call:
    inputs:
      build-image-tag:
        description: 'Build image tag for ghcr.io/usdot-fhwa-stol/carma-builds'
        required: false
        type: string
        default: 'jammy'
      sonar-organization:
        description: 'Sonar Cloud organization id'
        required: false
        type: string
        default: 'usdot-fhwa-stol'
      sonar-project-key:
        description: 'Sonar Cloud project key'
        required: true
        type: string
    secrets:
      github-token:
        required: true
      sonarcloud-token:
        required: true

jobs:
  image-name-get:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.set_image.outputs.image }}
    steps:
      - id: set_image
        run: echo "image=${{ inputs.build-image-tag }}" >> $GITHUB_OUTPUT

  sonar-scanner-cpp:
    runs-on: ubuntu-latest
    needs: image-name-get
    env:
      SONAR_TOKEN: ${{ secrets.sonarcloud-token }}
    container:
      image: ghcr.io/usdot-fhwa-stol/carma-builds-x64:${{ needs.image-name-get.outputs.image }}
    steps:
      - name: Install curl, zip, git, gcovr
        run: |
          apt update
          export DEBIAN_FRONTEND=noninteractive
          apt-get install -y curl zip git gcovr
      - uses: actions/checkout@v3
        with:
          # Disabling shallow clone is recommended for improving relevancy of reporting
          fetch-depth: 0

      - name: Run install_dependencies.sh script
        run: |
          if [ -f install_dependencies.sh ]; then
            chmod +x install_dependencies.sh
            ./install_dependencies.sh
          fi

      - name: Run build script
        uses: usdot-fhwa-stol/actions/build-cpp-library@update_sonar_scanner_cpp_workflow
        with:
          build-options: -c

      - name: Validate sonar inputs and check Coverage output
        run: |
          test -f sonar-project.properties
          echo "Found sonar-project.properties"

          echo "Searching for compile_commands.json..."
          find . -name compile_commands.json || true
          ls -al /opt/carma/build/compile_commands.json || true
          ls -al build/compile_commands.json || true
          
          echo "Checking coverage output..."
          ls -al build/coverage_sonar.xml || true

      - name: Set CLONED_REPO_PATH
        run: echo "CLONED_REPO_PATH=$GITHUB_WORKSPACE" >> $GITHUB_ENV
      - run: ls -la && pwd 
      - name: Run sonar-scanner
        uses: usdot-fhwa-stol/actions/sonar-scanner@update_sonar_scanner_cpp_workflow
        with:
          sonar-token: ${{ secrets.sonarcloud-token }}
          working-dir: ${{ env.CLONED_REPO_PATH }}
